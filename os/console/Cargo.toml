[package]
name = "console"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BeetOS console output service — fan-out from `ConsoleOp::Write` IPC to UART and TCP"

[[bin]]
name = "console"
path = "src/main.rs"

[dependencies]
xous = { path = "../../xous/xous-rs" }
beetos = { path = "../../beetos" }
beetos-api-console = { path = "../../api/console" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(beetos)'] }
